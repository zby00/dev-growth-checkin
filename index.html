<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华为云开发者成长打卡</title>
<style>
  :root {
    --bg: #0a0e1a;
    --bg-2: #0f1424;
    --card: rgba(22, 28, 45, 0.55);
    --card-border: rgba(0, 212, 255, 0.18);
    --neon: #00d4ff;
    --neon-2: #a855f7;
    --neon-3: #ec4899;
    --text: #e6edf6;
    --text-dim: #8b97b0;
    --gold: #ffd700;
    --silver: #c0c8d4;
    --bronze: #cd7f4d;
    --platinum: #e5e9f0;
    --diamond: #7df9ff;
    --good: #34d399;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 12%, rgba(0, 212, 255, 0.14), transparent 42%),
      radial-gradient(circle at 85% 18%, rgba(168, 85, 247, 0.14), transparent 42%),
      radial-gradient(circle at 50% 95%, rgba(236, 72, 153, 0.10), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 212, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(circle at 50% 30%, black, transparent 75%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ===== Header ===== */
  header {
    text-align: center;
    margin-bottom: 34px;
    position: relative;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .logo {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--neon), var(--neon-2));
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 15px;
    color: #061021;
    box-shadow: 0 0 24px rgba(0, 212, 255, 0.55), inset 0 0 12px rgba(255,255,255,0.25);
    letter-spacing: -1px;
  }

  .brand-text {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  h1 {
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffffff, var(--neon) 45%, var(--neon-2) 75%, #ffffff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }

  @keyframes shine { to { background-position: 200% center; } }

  .subtitle {
    margin-top: 10px;
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 1px;
  }

  .subtitle .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 10px var(--good);
    margin: 0 8px;
    vertical-align: middle;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ===== Grid ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .grid .full { grid-column: 1 / -1; }

  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* ===== Card ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 24px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    transition: border-color .35s, transform .35s;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(0,212,255,0.35), transparent 40%, transparent 60%, rgba(168,85,247,0.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: .6;
    pointer-events: none;
  }

  .card:hover { border-color: rgba(0, 212, 255, 0.4); }

  .card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--text);
  }

  .card-title .bar {
    width: 4px; height: 18px;
    border-radius: 2px;
    background: linear-gradient(var(--neon), var(--neon-2));
    box-shadow: 0 0 8px var(--neon);
  }

  .card-title .sub {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 400;
  }

  /* ===== Checkin Card ===== */
  .checkin-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 8px 0 4px;
  }

  .streak-num {
    font-size: 64px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(180deg, #fff, var(--neon));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(0,212,255,0.25);
  }

  .streak-label {
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 1px;
    margin-top: -10px;
  }

  .streak-label b { color: var(--neon); font-weight: 600; }

  .checkin-btn {
    position: relative;
    border: none;
    cursor: pointer;
    padding: 14px 42px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #061021;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--neon), #2dd4ff 50%, var(--neon-2));
    box-shadow: 0 6px 22px rgba(0, 212, 255, 0.45), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform .2s, box-shadow .3s, filter .3s;
    overflow: hidden;
  }

  .checkin-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0, 212, 255, 0.6), inset 0 1px 0 rgba(255,255,255,0.4);
  }

  .checkin-btn:active:not(:disabled) { transform: translateY(0) scale(.98); }

  .checkin-btn:disabled {
    cursor: not-allowed;
    background: linear-gradient(135deg, #1e293b, #334155);
    color: var(--text-dim);
    box-shadow: none;
    filter: none;
  }

  .checkin-btn .ripple {
    position: absolute;
    border-radius: 50%;
    transform: scale(0);
    background: rgba(255,255,255,0.5);
    animation: ripple .6s ease-out;
    pointer-events: none;
  }

  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  .checkin-tip {
    font-size: 12px;
    color: var(--text-dim);
    min-height: 16px;
  }

  /* ===== Progress Card ===== */
  .progress-body {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ring-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    flex-shrink: 0;
  }

  .ring-wrap svg { transform: rotate(-90deg); }

  .ring-bg { stroke: rgba(255,255,255,0.07); }
  .ring-fg {
    stroke: url(#ringGrad);
    transition: stroke-dashoffset 1s cubic-bezier(.22,1,.36,1);
    filter: drop-shadow(0 0 6px rgba(0,212,255,0.6));
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
  }

  .ring-center .pct {
    font-size: 34px;
    font-weight: 800;
    color: var(--neon);
  }

  .ring-center .pct-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .progress-info {
    flex: 1;
    min-width: 160px;
  }

  .progress-info .row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.08);
    font-size: 14px;
  }

  .progress-info .row:last-child { border-bottom: none; }
  .progress-info .row span:first-child { color: var(--text-dim); }
  .progress-info .row span:last-child { color: var(--text); font-weight: 600; }
  .progress-info .row .accent { color: var(--neon); }

  /* ===== Achievements ===== */
  .badges {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
  }

  .badge {
    position: relative;
    border-radius: 16px;
    padding: 20px 14px 16px;
    text-align: center;
    background: rgba(15, 20, 36, 0.6);
    border: 1px solid rgba(255,255,255,0.06);
    transition: transform .35s, border-color .35s;
    overflow: hidden;
  }

  .badge .medal {
    width: 58px;
    height: 58px;
    margin: 0 auto 12px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 26px;
    position: relative;
    transition: filter .4s;
  }

  .badge .medal::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid transparent;
  }

  .badge .name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .badge .level {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .badge .req {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    opacity: .8;
  }

  .badge.locked .medal { filter: grayscale(1) brightness(.5); }
  .badge.locked .name { color: var(--text-dim); }
  .badge.locked .lock {
    position: absolute;
    top: 10px; right: 12px;
    font-size: 13px;
    opacity: .5;
  }

  .badge.unlocked {
    border-color: var(--bdg-color, var(--neon));
    box-shadow: 0 0 18px rgba(0,212,255,0.15);
  }

  .badge.unlocked .medal {
    box-shadow: 0 0 22px var(--bdg-glow, rgba(0,212,255,0.5));
  }

  .badge.unlocked .medal::after {
    border-color: var(--bdg-color, var(--neon));
    border-style: dashed;
    animation: spin 8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .badge.unlocked.just-unlocked {
    animation: pop .6s cubic-bezier(.22,1,.36,1);
  }

  @keyframes pop {
    0% { transform: scale(.7); opacity: 0; }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }

  .badge-tier-bronze { --bdg-color: var(--bronze); --bdg-glow: rgba(205,127,77,0.5); }
  .badge-tier-silver { --bdg-color: var(--silver); --bdg-glow: rgba(192,200,212,0.5); }
  .badge-tier-gold   { --bdg-color: var(--gold);   --bdg-glow: rgba(255,215,0,0.55); }
  .badge-tier-platinum { --bdg-color: var(--platinum); --bdg-glow: rgba(229,233,240,0.5); }
  .badge-tier-diamond { --bdg-color: var(--diamond); --bdg-glow: rgba(125,249,255,0.6); }

  .medal-bronze { background: radial-gradient(circle at 35% 30%, #e8a87c, #cd7f4d 60%, #8a4f2a); }
  .medal-silver { background: radial-gradient(circle at 35% 30%, #f0f4f8, #c0c8d4 60%, #8a94a8); }
  .medal-gold   { background: radial-gradient(circle at 35% 30%, #fff4b0, #ffd700 60%, #c9a400); }
  .medal-platinum { background: radial-gradient(circle at 35% 30%, #ffffff, #e5e9f0 60%, #aab4c8); }
  .medal-diamond { background: radial-gradient(circle at 35% 30%, #d6f9ff, #7df9ff 55%, #2bb8d6); }

  /* ===== Calendar ===== */
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .cal-nav {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .cal-nav button {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: background .2s, border-color .2s;
  }

  .cal-nav button:hover { background: rgba(0,212,255,0.15); border-color: var(--neon); }

  .cal-month {
    font-size: 16px;
    font-weight: 600;
    min-width: 120px;
    text-align: center;
  }

  .cal-stats {
    font-size: 12px;
    color: var(--text-dim);
  }

  .cal-stats b { color: var(--neon); }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .cal-dow {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    padding: 4px 0;
    font-weight: 500;
  }

  .cal-cell {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 10px;
    font-size: 13px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.025);
    border: 1px solid transparent;
    position: relative;
    transition: all .2s;
  }

  .cal-cell.empty { background: transparent; }

  .cal-cell.today {
    border-color: var(--neon);
    color: var(--neon);
    font-weight: 700;
  }

  .cal-cell.checked {
    background: linear-gradient(135deg, rgba(0,212,255,0.25), rgba(168,85,247,0.25));
    color: #fff;
    font-weight: 600;
    border-color: rgba(0,212,255,0.4);
  }

  .cal-cell.checked::after {
    content: "";
    position: absolute;
    bottom: 4px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 6px var(--good);
  }

  .cal-cell.checked.today {
    box-shadow: 0 0 14px rgba(0,212,255,0.5);
  }

  .cal-legend {
    display: flex;
    gap: 18px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }

  .cal-legend .lg {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .cal-legend .sw {
    width: 12px; height: 12px;
    border-radius: 4px;
    display: inline-block;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: rgba(15,20,36,0.92);
    border: 1px solid var(--neon);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    box-shadow: 0 8px 30px rgba(0,212,255,0.3);
    backdrop-filter: blur(10px);
    z-index: 100;
    transition: transform .45s cubic-bezier(.22,1,.36,1);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast .ic { font-size: 18px; }

  /* ===== Confetti / particles ===== */
  .fx-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 90;
  }

  .particle {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    animation: fly 1s ease-out forwards;
  }

  @keyframes fly {
    to {
      transform: translate(var(--dx), var(--dy)) scale(0);
      opacity: 0;
    }
  }

  /* ===== Footer ===== */
  footer {
    text-align: center;
    margin-top: 40px;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 1px;
  }

  footer .hw { color: var(--neon); font-weight: 600; }

  @media (max-width: 520px) {
    .wrap { padding: 20px 14px 50px; }
    .card { padding: 18px; }
    .streak-num { font-size: 52px; }
    .ring-wrap { width: 150px; height: 150px; }
    .progress-body { gap: 16px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">华为云</div>
        <div class="brand-text">HUAWEI CLOUD</div>
      </div>
      <h1>开发者成长打卡</h1>
      <div class="subtitle">坚持每一天<span class="dot"></span>点亮你的技术成长之路</div>
    </header>

    <main class="grid">
      <!-- 签到卡片 -->
      <section class="card" id="card-checkin">
        <div class="card-title">
          <span class="bar"></span>每日签到
          <span class="sub" id="today-label"></span>
        </div>
        <div class="checkin-body">
          <div>
            <div class="streak-num" id="streak-num">0</div>
            <div class="streak-label">已连续签到 <b id="streak-inline">0</b> 天</div>
          </div>
          <button class="checkin-btn" id="checkin-btn">立即签到</button>
          <div class="checkin-tip" id="checkin-tip"></div>
        </div>
      </section>

      <!-- 进度卡片 -->
      <section class="card" id="card-progress">
        <div class="card-title">
          <span class="bar"></span>周期进度
          <span class="sub">7 天为一个周期</span>
        </div>
        <div class="progress-body">
          <div class="ring-wrap">
            <svg width="180" height="180" viewBox="0 0 180 180">
              <defs>
                <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#00d4ff"/>
                  <stop offset="100%" stop-color="#a855f7"/>
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="90" cy="90" r="76" fill="none" stroke-width="12"/>
              <circle class="ring-fg" id="ring-fg" cx="90" cy="90" r="76" fill="none" stroke-width="12"
                      stroke-linecap="round" stroke-dasharray="477.5" stroke-dashoffset="477.5"/>
            </svg>
            <div class="ring-center">
              <div class="pct" id="ring-pct">0%</div>
              <div class="pct-sub" id="ring-sub">0 / 7 天</div>
            </div>
          </div>
          <div class="progress-info">
            <div class="row"><span>当前周期</span><span class="accent" id="pi-cycle">第 1 周期</span></div>
            <div class="row"><span>周期内签到</span><span id="pi-incycle">0 天</span></div>
            <div class="row"><span>累计签到</span><span id="pi-total">0 天</span></div>
            <div class="row"><span>最长连续</span><span id="pi-best">0 天</span></div>
          </div>
        </div>
      </section>

      <!-- 成就卡片 -->
      <section class="card full" id="card-achievements">
        <div class="card-title">
          <span class="bar"></span>成就徽章
          <span class="sub" id="badge-summary">已解锁 0 / 5</span>
        </div>
        <div class="badges" id="badges"></div>
      </section>

      <!-- 日历卡片 -->
      <section class="card full" id="card-calendar">
        <div class="card-title">
          <span class="bar"></span>签到日历
        </div>
        <div class="cal-head">
          <div class="cal-nav">
            <button id="cal-prev" aria-label="上一月">‹</button>
            <div class="cal-month" id="cal-month"></div>
            <button id="cal-next" aria-label="下一月">›</button>
          </div>
          <div class="cal-stats">本月已签 <b id="cal-month-count">0</b> 天</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-legend">
          <span class="lg"><span class="sw" style="background:linear-gradient(135deg,rgba(0,212,255,.25),rgba(168,85,247,.25));border:1px solid rgba(0,212,255,.4)"></span>已签到</span>
          <span class="lg"><span class="sw" style="border:1px solid var(--neon)"></span>今天</span>
          <span class="lg"><span class="sw" style="background:rgba(255,255,255,.025)"></span>未签到</span>
        </div>
      </section>
    </main>

    <footer>
      <span class="hw">华为云 CodeArts</span> · 开发者成长打卡 · 数据保存在本地浏览器
    </footer>
  </div>

  <div class="toast" id="toast"><span class="ic"></span><span class="msg"></span></div>
  <div class="fx-layer" id="fx-layer"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "hwcloud_dev_checkin_v1";
  var CYCLE_DAYS = 7;

  var ACHIEVEMENTS = [
    { days: 3,   name: "初心不改",   level: "铜牌", tier: "bronze",   icon: "🌱" },
    { days: 7,   name: "一周先锋",   level: "银牌", tier: "silver",   icon: "⚡" },
    { days: 14,  name: "半月达人",   level: "金牌", tier: "gold",     icon: "🔥" },
    { days: 30,  name: "坚持之星",   level: "铂金", tier: "platinum", icon: "🌟" },
    { days: 100, name: "传奇开发者", level: "钻石", tier: "diamond",  icon: "💎" }
  ];

  var DOW = ["日", "一", "二", "三", "四", "五", "六"];
  var MONTHS = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dateStr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayStr() { return dateStr(new Date()); }
  function parseDate(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.dates)) return d;
      }
    } catch (e) {}
    return { dates: [] };
  }

  function saveData(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  function calcStreak(dates) {
    if (!dates.length) return 0;
    var set = {};
    dates.forEach(function (d) { set[d] = true; });
    var streak = 0;
    var cur = new Date();
    if (!set[dateStr(cur)]) {
      cur.setDate(cur.getDate() - 1);
    }
    while (set[dateStr(cur)]) {
      streak++;
      cur.setDate(cur.getDate() - 1);
    }
    return streak;
  }

  function calcBestStreak(dates) {
    if (!dates.length) return 0;
    var sorted = dates.slice().sort();
    var best = 1, run = 1;
    for (var i = 1; i < sorted.length; i++) {
      var prev = parseDate(sorted[i - 1]);
      var curr = parseDate(sorted[i]);
      var diff = Math.round((curr - prev) / 86400000);
      if (diff === 1) { run++; if (run > best) best = run; }
      else { run = 1; }
    }
    return best;
  }

  function inCycleCount(dates) {
    var streak = calcStreak(dates);
    return streak % CYCLE_DAYS === 0 && streak > 0 ? CYCLE_DAYS : streak % CYCLE_DAYS;
  }

  var state = {
    data: loadData(),
    calYear: new Date().getFullYear(),
    calMonth: new Date().getMonth(),
    prevUnlocked: []
  };

  function $(id) { return document.getElementById(id); }

  function showToast(msg, icon) {
    var t = $("toast");
    t.querySelector(".ic").textContent = icon || "✅";
    t.querySelector(".msg").textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  function burst(x, y) {
    var layer = $("fx-layer");
    var colors = ["#00d4ff", "#a855f7", "#ec4899", "#34d399", "#ffd700"];
    for (var i = 0; i < 22; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      var angle = (Math.PI * 2 * i) / 22 + Math.random() * 0.4;
      var dist = 60 + Math.random() * 80;
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      p.style.animationDuration = (0.8 + Math.random() * 0.5) + "s";
      layer.appendChild(p);
      (function (el) { setTimeout(function () { el.remove(); }, 1400); })(p);
    }
  }

  function renderCheckin() {
    var dates = state.data.dates;
    var streak = calcStreak(dates);
    var today = todayStr();
    var checkedToday = dates.indexOf(today) !== -1;

    $("streak-num").textContent = streak;
    $("streak-inline").textContent = streak;

    var btn = $("checkin-btn");
    if (checkedToday) {
      btn.textContent = "今日已签到";
      btn.disabled = true;
      $("checkin-tip").textContent = "明天再来继续打卡吧～";
    } else {
      btn.textContent = "立即签到";
      btn.disabled = false;
      $("checkin-tip").textContent = "点击按钮，完成今日打卡";
    }

    var now = new Date();
    $("today-label").textContent = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " 周" + DOW[now.getDay()];
  }

  function renderProgress() {
    var dates = state.data.dates;
    var streak = calcStreak(dates);
    var inCycle = inCycleCount(dates);
    var cycleNum = Math.floor(streak / CYCLE_DAYS) + (streak % CYCLE_DAYS === 0 && streak > 0 ? 0 : 1);
    if (streak === 0) cycleNum = 1;
    var pct = Math.round((inCycle / CYCLE_DAYS) * 100);

    var r = 76;
    var circ = 2 * Math.PI * r;
    var fg = $("ring-fg");
    fg.setAttribute("stroke-dasharray", circ.toFixed(2));
    var offset = circ * (1 - inCycle / CYCLE_DAYS);
    fg.setAttribute("stroke-dashoffset", offset.toFixed(2));

    $("ring-pct").textContent = pct + "%";
    $("ring-sub").textContent = inCycle + " / " + CYCLE_DAYS + " 天";
    $("pi-cycle").textContent = "第 " + cycleNum + " 周期";
    $("pi-incycle").textContent = inCycle + " 天";
    $("pi-total").textContent = dates.length + " 天";
    $("pi-best").textContent = calcBestStreak(dates) + " 天";
  }

  function renderBadges(newlyUnlocked) {
    var streak = calcStreak(state.data.dates);
    var container = $("badges");
    container.innerHTML = "";
    var unlockedCount = 0;
    newlyUnlocked = newlyUnlocked || [];

    ACHIEVEMENTS.forEach(function (a) {
      var unlocked = streak >= a.days;
      if (unlocked) unlockedCount++;
      var div = document.createElement("div");
      div.className = "badge badge-tier-" + a.tier + (unlocked ? " unlocked" : " locked");
      if (newlyUnlocked.indexOf(a.days) !== -1) div.classList.add("just-unlocked");
      div.innerHTML =
        (unlocked ? "" : '<span class="lock">🔒</span>') +
        '<div class="medal medal-' + a.tier + '">' + a.icon + "</div>" +
        '<div class="name">' + a.name + "</div>" +
        '<div class="level">' + a.level + "</div>" +
        '<div class="req">' + (unlocked ? "已达成" : "连续签到 " + a.days + " 天解锁") + "</div>";
      container.appendChild(div);
    });

    $("badge-summary").textContent = "已解锁 " + unlockedCount + " / " + ACHIEVEMENTS.length;
  }

  function renderCalendar() {
    var dates = state.data.dates;
    var set = {};
    dates.forEach(function (d) { set[d] = true; });

    var y = state.calYear, m = state.calMonth;
    $("cal-month").textContent = y + "年 " + MONTHS[m];

    var grid = $("cal-grid");
    grid.innerHTML = "";

    DOW.forEach(function (w) {
      var el = document.createElement("div");
      el.className = "cal-dow";
      el.textContent = "周" + w;
      grid.appendChild(el);
    });

    var firstDay = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var today = todayStr();
    var monthCount = 0;

    for (var i = 0; i < firstDay; i++) {
      var empty = document.createElement("div");
      empty.className = "cal-cell empty";
      grid.appendChild(empty);
    }

    for (var day = 1; day <= daysInMonth; day++) {
      var ds = y + "-" + pad(m + 1) + "-" + pad(day);
      var cell = document.createElement("div");
      cell.className = "cal-cell";
      cell.textContent = day;
      if (ds === today) cell.classList.add("today");
      if (set[ds]) { cell.classList.add("checked"); monthCount++; }
      grid.appendChild(cell);
    }

    $("cal-month-count").textContent = monthCount;
  }

  function renderAll(newlyUnlocked) {
    renderCheckin();
    renderProgress();
    renderBadges(newlyUnlocked);
    renderCalendar();
  }

  function doCheckin() {
    var today = todayStr();
    if (state.data.dates.indexOf(today) !== -1) return;

    var prevStreak = calcStreak(state.data.dates);
    state.data.dates.push(today);
    saveData(state.data);

    var btn = $("checkin-btn");
    var rect = btn.getBoundingClientRect();
    burst(rect.left + rect.width / 2, rect.top + rect.height / 2);

    var newStreak = calcStreak(state.data.dates);
    var newlyUnlocked = [];
    ACHIEVEMENTS.forEach(function (a) {
      if (prevStreak < a.days && newStreak >= a.days) newlyUnlocked.push(a.days);
    });

    renderAll(newlyUnlocked);

    if (newlyUnlocked.length) {
      var names = ACHIEVEMENTS.filter(function (a) { return newlyUnlocked.indexOf(a.days) !== -1; })
                              .map(function (a) { return a.name; }).join("、");
      showToast("🎉 签到成功！解锁徽章：" + names, "🏆");
    } else {
      showToast("签到成功！已连续打卡 " + newStreak + " 天，继续加油！", "✅");
    }
  }

  function moveMonth(delta) {
    state.calMonth += delta;
    if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    renderCalendar();
  }

  $("checkin-btn").addEventListener("click", function (e) {
    var rect = this.getBoundingClientRect();
    var ripple = document.createElement("span");
    ripple.className = "ripple";
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + "px";
    ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
    ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
    this.appendChild(ripple);
    setTimeout((function (r) { return function () { r.remove(); }; })(ripple), 600);
    doCheckin();
  });

  $("cal-prev").addEventListener("click", function () { moveMonth(-1); });
  $("cal-next").addEventListener("click", function () { moveMonth(1); });

  renderAll();

  setInterval(function () {
    var checkedToday = state.data.dates.indexOf(todayStr()) !== -1;
    var btn = $("checkin-btn");
    if (!checkedToday && btn.disabled) renderCheckin();
  }, 60000);
})();
</script>
</body>
</html>
